name: hf-watcher

on:
  schedule:
    - cron: '23 6 * * *' # every day at 06:23 UTC
  workflow_dispatch:
    inputs:
      since:
        description: Look back to this date (YYYY-MM-DD) instead of the default 30 days
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: hf-watcher

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # pinned to exact commits so a changed release tag can't swap in different code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Find new models and open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SINCE: ${{ inputs.since }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/watch-hf.mjs --open-prs ${SINCE:+--since "$SINCE"}
